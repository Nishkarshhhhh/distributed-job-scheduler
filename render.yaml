# ==============================================================================
# Render Blueprint - Distributed Job Scheduler
# Region: Singapore (singapore)
# ==============================================================================

# ------------------------------------------------------------------------------
# PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: distributed-job-scheduler-db
    databaseName: job_scheduler
    user: scheduler
    region: singapore
    plan: free
    ipAllowList: [] # Internal connections only

services:
  # ----------------------------------------------------------------------------
  # 1. Render Key Value (Redis-compatible queue backend)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: distributed-job-scheduler-redis
    region: singapore
    plan: free
    ipAllowList: [] # Internal connections only

  # ----------------------------------------------------------------------------
  # 2. Backend REST API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: distributed-job-scheduler-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: distributed-job-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: distributed-job-scheduler-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: WORKER_CONCURRENCY
        value: 5
      - key: ALLOW_INTERNAL_NETWORK_REQUESTS
        value: "false"

  # ----------------------------------------------------------------------------
  # 3. Distributed BullMQ Background Worker
  # ----------------------------------------------------------------------------
  - type: worker
    name: distributed-job-scheduler-worker
    runtime: docker
    region: singapore
    plan: starter # Background workers require Starter plan on Render
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: node dist/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: distributed-job-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: distributed-job-scheduler-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: distributed-job-scheduler-api
          envVarKey: JWT_SECRET
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: WORKER_CONCURRENCY
        value: 10
      - key: ALLOW_INTERNAL_NETWORK_REQUESTS
        value: "false"

  # ----------------------------------------------------------------------------
  # 4. React Frontend Dashboard
  # ----------------------------------------------------------------------------
  - type: web
    name: job-scheduler-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://distributed-job-scheduler-api.onrender.com/api
