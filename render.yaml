# ==============================================================================
# Render Blueprint - Distributed Job Scheduler
# Architecture (Embedded Free Mode):
#   - PostgreSQL Database (Free tier)
#   - Render Key Value / Redis (Free tier)
#   - Backend REST API with Embedded BullMQ Worker (Free Web Service)
#   - React Frontend Dashboard (Free Static Site)
# ==============================================================================

# ------------------------------------------------------------------------------
# PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: distributed-job-scheduler-db
    databaseName: job_scheduler
    user: scheduler
    region: singapore
    plan: free
    ipAllowList: [] # Internal connections only

services:
  # ----------------------------------------------------------------------------
  # 1. Render Key Value (Redis-compatible queue backend)
  # ----------------------------------------------------------------------------
  - type: keyvalue
    name: distributed-job-scheduler-redis
    region: singapore
    plan: free
    ipAllowList: [] # Internal connections only

  # ----------------------------------------------------------------------------
  # 2. Backend REST API Service + Embedded BullMQ Worker
  # ----------------------------------------------------------------------------
  - type: web
    name: distributed-job-scheduler-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: ./backend
    dockerfilePath: ./Dockerfile.prod
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: embedded
      - key: DATABASE_URL
        fromDatabase:
          name: distributed-job-scheduler-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: distributed-job-scheduler-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: WORKER_CONCURRENCY
        value: 5
      - key: ALLOW_INTERNAL_NETWORK_REQUESTS
        value: "false"

  # ----------------------------------------------------------------------------
  # 3. React Frontend Dashboard
  # ----------------------------------------------------------------------------
  - type: web
    name: job-scheduler-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
